spring:
  application:
    name: schedular
  # Metadata DB (jobs, connections, run history). Defaults match docker-compose.yml.
  datasource:
    url: ${SCHEDULAR_DB_URL:jdbc:postgresql://localhost:5432/schedular_meta}
    username: ${SCHEDULAR_DB_USER:schedular}
    password: ${SCHEDULAR_DB_PASSWORD:schedular}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true
  # Cron triggers live in the metadata DB (tables from Flyway V3). Instances sharing the DB form a cluster:
  # each firing runs on exactly one instance.
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    scheduler-name: schedular
    wait-for-jobs-to-complete-on-shutdown: false
    properties:
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 15000
      org.quartz.jobStore.misfireThreshold: 60000
      # How often an idle scheduler looks for new or changed triggers (Quartz's default is 30s).
      org.quartz.scheduler.idleWaitTime: 5000
      # Upper bound on jobs running at the same time on one instance.
      org.quartz.threadPool.threadCount: 5

schedular:
  # Base64 AES-256 key for encrypting connection passwords: `openssl rand -base64 32`.
  # Keep it stable: changing it makes stored passwords unreadable.
  secret-key: ${SCHEDULAR_SECRET_KEY:}
  connection-test-timeout: 15s
  # This instance's name, recorded on the runs it starts; must be stable and unique within a cluster.
  node-id: ${SCHEDULAR_NODE_ID:}
  engine:
    # Transient write failures (lost connection, deadlock) are retried up to the job's maxRetries,
    # waiting retry-backoff, then doubling up to max-retry-backoff.
    retry-backoff: 1s
    max-retry-backoff: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
